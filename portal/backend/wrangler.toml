name = "pcstats-portal"
main = "./worker.js"
compatibility_date = "2026-11-19"

[assets]
directory = "../site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "pcstats-presence"
database_id = "REPLACE_WITH_ID_FROM_WRANGLER_D1_CREATE"

[vars]
SITE_ORIGIN = "*"

[triggers]
crons = ["*/1 * * * *"]

